version: '3.8'

services:
  ai_challenge:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-for-industry-challenge:latest
    container_name: ai_challenge_dev
    hostname: ai-challenge

    # Enable GPU support (if available)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

    # Network configuration
    network_mode: host

    # Display configuration for GUI applications
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all

    # Volume mounts
    volumes:
      # Mount workspace
      - ./src:/workspace/src
      - ./config:/workspace/config
      - ./scripts:/workspace/scripts
      - ./data:/workspace/data
      - ./models:/workspace/models

      # X11 socket for GUI
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

      # Share host's .bashrc and .bash_history
      - ~/.bashrc:/root/.bashrc_host:ro
      - ~/.bash_history:/root/.bash_history

    # Keep container running
    stdin_open: true
    tty: true

    # Privileged mode for hardware access
    privileged: true

    command: /bin/bash
